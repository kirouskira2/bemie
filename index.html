    <meta name="mobile-web-app-capable" content="yes" />

      name="description"
      content="Loja bemiemodapraia: catálogo de biquínis, maiôs e saídas de praia feitos para quem vive o sol. Compre pelo catálogo e finalize seu pedido via WhatsApp."
    />
    <meta property="og:title" content="Loja | Bemiê Moda Praia" />
    <meta
      property="og:description"
      content="Loja bemiemodapraia: catálogo de biquínis, maiôs e saídas de praia feitos para quem vive o sol. Compre pelo catálogo e finalize seu pedido via WhatsApp."

    <!-- Favicon: nome BEMIÊ em SVG transparente (sem fundo) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Fallback para navegadores sem suporte a SVG favicon -->
    <link rel="icon" type="image/jpeg" href="/logos/bemie-brand-logo.jpg" sizes="32x32" />
    <!-- Apple touch icon: logo quadrado com fundo para iOS -->
    <link rel="apple-touch-icon" href="/logos/bemie-brand-logo.jpg" />
    <!-- Script de desregistro de Service Workers residuais para eliminar no-op fetch handler -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }
    </script>
    <!-- Preconnect para fontes Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
